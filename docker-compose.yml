services:
  fastapi:
    build: .
    container_name: machineguard-api
    networks:
      - machineguard-network
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8080:8000"
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1

  prefect-server:
    build: .
    container_name: machineguard-prefect-server
    networks:
      - machineguard-network
    command: prefect server start --host 0.0.0.0 --port 4200
    ports:
      - "4200:4200"
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prefect:
    build: .
    container_name: machineguard-prefect
    networks:
      - machineguard-network
    command: python main_pipeline.py
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PREFECT_API_DATABASE_CONNECTION_TIMEOUT=60
      - PREFECT_API_REQUEST_TIMEOUT=60.0
    depends_on:
      fastapi:
        condition: service_started
      prefect-server:
        condition: service_healthy

  streamlit:
    build: .
    container_name: machineguard-ui
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    networks:
      - machineguard-network
    volumes:
      - ./:/app
    environment:
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SENDER=${SMTP_SENDER:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - NOTIFICATION_RECIPIENT=${NOTIFICATION_RECIPIENT:-}

networks:
  machineguard-network:
    driver: bridge
