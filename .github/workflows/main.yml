name: machineguard-ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run DeepChecks
        run: python scripts/deepchecks_runner.py

      - name: Run Prefect pipeline
        run: python main_pipeline.py

      - name: Validate metrics artifact
        run: |
          test -f outputs/metrics.json
          python - <<'PY'
          import json
          with open("outputs/metrics.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert "metrics" in data, "metrics key missing"
          assert "tasks" in data["metrics"], "tasks key missing"
          print("metrics.json is valid")
          PY

      - name: Build Docker image
        run: docker build -t machineguard:ci .
